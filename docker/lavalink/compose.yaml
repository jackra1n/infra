name: lavalink

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: lavalink
    volumes:
      - ${DOCKER_DATA_DIR:?error}/${COMPOSE_PROJECT_NAME:?error}/application.yml:/opt/Lavalink/application.yml:ro
    environment:
      - _JAVA_OPTIONS=-Xmx2G -XX:+UseZGC
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_SERVER_PASSWORD:?Set LAVALINK_SERVER_PASSWORD}
      - YT_CIPHER_API_TOKEN=${YT_CIPHER_API_TOKEN:?Set YT_CIPHER_API_TOKEN}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN:-}
      - TZ=Europe/Berlin
    ports:
      - '2333:2333'
    depends_on:
      - yt-cipher
      - spotify-tokener
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2.5G

  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    environment:
      - API_TOKEN=${YT_CIPHER_API_TOKEN:?Set YT_CIPHER_API_TOKEN}
      - OVERRIDE_PLAYER_VARIANT=IAS
    restart: unless-stopped

  spotify-tokener:
    image: ghcr.io/topi314/spotify-tokener:master
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
